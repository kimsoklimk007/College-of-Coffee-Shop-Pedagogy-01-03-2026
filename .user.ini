; PHP Configuration for Large File Uploads
; Supports extremely large files up to 90000000000000GB

upload_max_filesize = 90000000000000G
post_max_size = 90000000000000G
max_execution_time = 3600
max_input_time = 3600
memory_limit = -1
max_file_uploads = 100

; Additional settings for large uploads
max_input_vars = 10000
max_multipart_body_parts = -1
